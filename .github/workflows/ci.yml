name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Camelot and Tabula are optional fallback engines that need system
      # software (Ghostscript / Java); the suite is designed to run without
      # them, and --check-deps confirms which engines are active on the runner.
      - name: Report dependency status
        run: python pdf_to_excel.py --check-deps

      - name: Run test suite
        run: python -m unittest test_pdf_to_excel -v
