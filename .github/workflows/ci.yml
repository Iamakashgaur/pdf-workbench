name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # LibreOffice is needed only by --to-pdf, and pip cannot install it.
      # Installed on every leg so the live conversion test runs for real
      # everywhere rather than skipping.
      #
      # The Windows leg earns its time twice over: the installer there does not
      # put soffice on PATH, so that job is the only place the install-location
      # fallback in _find_binary is exercised end to end - and that fallback is
      # the difference between the feature working and appearing broken for
      # every Windows user.
      - name: Install LibreOffice (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer libreoffice-calc
          soffice --version

      # Tolerated on failure on purpose. This pulls a ~350 MB installer from a
      # third-party mirror that intermittently times out, and the Chocolatey
      # package lags upstream releases - so its URL can 404 for a day after a
      # LibreOffice version bump. A slow mirror is not a broken build.
      #
      # When it does fail, the live conversion test skips itself and the run
      # reports "OK (skipped=1)" instead of "OK", so the lost coverage is
      # visible in the log rather than silently assumed.
      - name: Install LibreOffice (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          $exe = "C:\Program Files\LibreOffice\program\soffice.exe"
          foreach ($attempt in 1..3) {
            Write-Host "LibreOffice install, attempt $attempt of 3"
            try { choco install libreoffice-fresh -y --no-progress } catch {
              Write-Host "attempt $attempt raised: $_"
            }
            if (Test-Path $exe) { break }
            if ($attempt -lt 3) { Start-Sleep -Seconds 25 }
          }
          if (Test-Path $exe) {
            # Deliberately not added to PATH: leaving it off is what makes this
            # job cover the install-location fallback in _find_binary.
            Write-Host "installed: $exe"
          } else {
            Write-Warning ("LibreOffice unavailable after 3 attempts. The live " +
                           "conversion test will skip on this leg; see the test " +
                           "summary for 'skipped=1'.")
          }

      # Camelot and Tabula are optional fallback engines that need system
      # software (Ghostscript / Java); the suite is designed to run without
      # them, and --check-deps confirms which engines are active on the runner.
      - name: Report dependency status
        run: python pdf_to_excel.py --check-deps

      - name: Run test suite
        run: python -m unittest test_pdf_to_excel -v
